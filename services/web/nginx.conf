server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API, MJPEG stream, and captured images -> the api service.
    # Trailing slash on proxy_pass strips the /api prefix (/api/detections -> /detections).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # essential for the MJPEG stream
        proxy_read_timeout 3600s;
    }

    # SPA fallback (client-side routing / hash routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
